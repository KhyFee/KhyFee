<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-label="KhyFee skills dashboard">
  <defs>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="ai" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="speed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="bugs" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="pw" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="smoke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <rect width="900" height="340" rx="18" fill="url(#card)" stroke="#1f2937" stroke-width="2"/>
  <text x="28" y="42" fill="#e2e8f0" font-family="Consolas, Monaco, monospace" font-size="20" font-weight="700">./skills --dashboard</text>
  <text x="28" y="66" fill="#64748b" font-family="Consolas, Monaco, monospace" font-size="13">real capabilities · no fake metrics</text>

  <!-- AI -->
  <text x="28" y="110" fill="#94a3b8" font-family="Consolas, Monaco, monospace" font-size="14">AI Workflows</text>
  <text x="820" y="110" fill="#67e8f9" font-family="Consolas, Monaco, monospace" font-size="14" text-anchor="end">expert</text>
  <rect x="28" y="118" width="844" height="14" rx="7" fill="#111827"/>
  <rect x="28" y="118" width="800" height="14" rx="7" fill="url(#ai)">
    <animate attributeName="width" from="0" to="800" dur="1.4s" fill="freeze"/>
  </rect>

  <!-- Fast delivery -->
  <text x="28" y="160" fill="#94a3b8" font-family="Consolas, Monaco, monospace" font-size="14">Fast Project Delivery</text>
  <text x="820" y="160" fill="#6ee7b7" font-family="Consolas, Monaco, monospace" font-size="14" text-anchor="end">strong</text>
  <rect x="28" y="168" width="844" height="14" rx="7" fill="#111827"/>
  <rect x="28" y="168" width="760" height="14" rx="7" fill="url(#speed)">
    <animate attributeName="width" from="0" to="760" dur="1.5s" fill="freeze"/>
  </rect>

  <!-- Bug detection -->
  <text x="28" y="210" fill="#94a3b8" font-family="Consolas, Monaco, monospace" font-size="14">Bug &amp; Problem Detection</text>
  <text x="820" y="210" fill="#fda4af" font-family="Consolas, Monaco, monospace" font-size="14" text-anchor="end">strong</text>
  <rect x="28" y="218" width="844" height="14" rx="7" fill="#111827"/>
  <rect x="28" y="218" width="740" height="14" rx="7" fill="url(#bugs)">
    <animate attributeName="width" from="0" to="740" dur="1.6s" fill="freeze"/>
  </rect>

  <!-- Playwright -->
  <text x="28" y="260" fill="#94a3b8" font-family="Consolas, Monaco, monospace" font-size="14">Playwright E2E</text>
  <text x="820" y="260" fill="#c4b5fd" font-family="Consolas, Monaco, monospace" font-size="14" text-anchor="end">strong</text>
  <rect x="28" y="268" width="844" height="14" rx="7" fill="#111827"/>
  <rect x="28" y="268" width="720" height="14" rx="7" fill="url(#pw)">
    <animate attributeName="width" from="0" to="720" dur="1.7s" fill="freeze"/>
  </rect>

  <!-- Smoke -->
  <text x="28" y="310" fill="#94a3b8" font-family="Consolas, Monaco, monospace" font-size="14">Smoke Testing</text>
  <text x="820" y="310" fill="#fcd34d" font-family="Consolas, Monaco, monospace" font-size="14" text-anchor="end">strong</text>
  <rect x="28" y="318" width="844" height="14" rx="7" fill="#111827"/>
  <rect x="28" y="318" width="700" height="14" rx="7" fill="url(#smoke)">
    <animate attributeName="width" from="0" to="700" dur="1.8s" fill="freeze"/>
  </rect>
</svg>
